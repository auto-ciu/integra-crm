name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets auto-merge.yml re-run CI on main after a merge: pushes made with
  # GITHUB_TOKEN do not trigger `push` workflows, but workflow_dispatch does.
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run verify
      - run: npm run typecheck
  upgrade-smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Bump to latest patch of current minor and test
      - run: npx npm-check-updates --filter 'twenty-sdk,twenty-client-sdk' --target patch -u
      - run: npm install
      - run: npm run verify
      - run: npm run typecheck
